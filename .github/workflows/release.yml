name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            runner: windows-latest
            ext: .exe
            ldflags: -H windowsgui -s -w
          - goos: darwin
            goarch: amd64
            runner: macos-latest
            ext: ''
            ldflags: -s -w
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            ext: ''
            ldflags: -s -w
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            ext: ''
            ldflags: -s -w
            cgo: 0

    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: ${{ matrix.cgo || 1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux dependencies
        if: matrix.goos == 'linux' && matrix.cgo == 1
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev

      - name: Build frontend
        run: cd web && npm install && npm run build

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags "${{ matrix.ldflags }}" -o codex-go-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/codex-go/

      - name: Package macOS .app
        if: matrix.goos == 'darwin'
        run: |
          mkdir -p "codex-go.app/Contents/MacOS"
          mkdir -p "codex-go.app/Contents/Resources"
          cp codex-go-${{ matrix.goos }}-${{ matrix.goarch }} "codex-go.app/Contents/MacOS/codex-go"
          cp cmd/codex-go/Info.plist "codex-go.app/Contents/"
          cp cmd/codex-go/codex-go.icns "codex-go.app/Contents/Resources/codex-go.icns"
          zip -r codex-go-${{ matrix.goos }}-${{ matrix.goarch }}.zip codex-go.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-go-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            codex-go-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
            codex-go-${{ matrix.goos }}-${{ matrix.goarch }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -la dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            ## 下载

            | 平台 | 文件 |
            |------|------|
            | Windows | `codex-go-windows-amd64.exe` |
            | macOS (Intel) | `codex-go-darwin-amd64.zip` |
            | macOS (Apple Silicon) | `codex-go-darwin-arm64.zip` |
            | Linux | `codex-go-linux-amd64` |

            ## macOS 用户注意

            下载 `.zip` 解压后，由于应用未签名，需在终端运行：

            ```bash
            xattr -cr codex-go.app
            ```

            然后即可正常打开。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
